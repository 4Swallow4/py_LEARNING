                - generic [ref=f1e204]: Tortoise is an American post-rock band formed in Chicago, Illinois, in 1990. [1] The band incorporates krautrock, dub, minimal music, electronica and jazz into their music, and their eclectic style has left a great influence on the post-rock genre. Tortoise have been consistently credited, as part of the Chicago school of post-rock, for its rise in the 1990s.
