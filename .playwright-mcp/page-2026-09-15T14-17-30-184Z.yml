          - text: TORTOISE announce new album
          - emphasis [ref=f7e20]: TOUCH
        - paragraph [ref=f7e21]: Out October 24, 2025 on LP / CD / Digital Download. Plus ongoing tour dates in 2026.
        - figure [ref=f7e22]:
          - link [ref=f7e23] [cursor=pointer]:
