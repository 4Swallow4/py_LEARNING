        - heading "Upcoming Shows" [level=2] [ref=f7e61]
        - paragraph [ref=f7e62]:
          - text: A series of special shows was planned through the end of the 2025, including
          - strong [ref=f7e63]: The Broad Museum
          - text: in Los Angeles, a three-night weekend stand at NYC’s
          - strong [ref=f7e64]: Bowery Ballroom
          - text: ", two shows at the"
          - strong [ref=f7e65]: Barbican
          - text: for EFG London Jazz Festival, and a landmark show at
          - strong [ref=f7e66]: The Auditorium in Chicago
          - text: ", where"
          - strong [ref=f7e67]: Tortoise played with the Chicago Philharmonic
          - text: for the first time. The band will embark on European tours in early 2026, with more dates worldwide to be announced.
