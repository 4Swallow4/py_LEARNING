        - figure [ref=f7e40]:
          - link [ref=f7e41] [cursor=pointer]:
            - /url: https://web.archive.org/web/20260629184914/https://intlanthem.us9.list-manage.com/track/click?u=bdf63ba201aac3a40783dd64e&id=50164cb3a3&e=902961715e
        - paragraph [ref=f7e42]:
          - text: With
          - emphasis [ref=f7e43]: Touch
          - text: ", the Tortoise bandmembers —"
          - strong [ref=f7e44]: Dan Bitney
          - text: ","
          - strong [ref=f7e45]: John Herndon
          - text: ","
          - strong [ref=f7e46]: Douglas McCombs
          - text: ","
          - strong [ref=f7e47]: John McEntire
          - text: ", and"
          - strong [ref=f7e48]: Jeff Parker
          - text: — harness their collectivist songwriting approach, a slightly anarchistic but resolutely egalitarian process where ideas triumph over ego towards an abstracted muscularity. While there are still excursions into the dusky, elegantly gnarled jazz ambience that flourished on landmark works like
          - emphasis [ref=f7e49]: Millions Now Living Will Never Die
          - text: and
          - emphasis [ref=f7e50]: TNT
          - text: ","
          - emphasis [ref=f7e51]: Touch
          - text: is perhaps most remarkable for Tortoise’s unapologetic embrace of grand gesture. Aerodynamically re-engineered Krautrock, hand-cranked techno rave-ups, and pointillist spaghetti western fanfares are all imbued with Tortoise’s now-signature internal logic — equally alluring and confounding, a puzzle to be savored rather than solved.
        - paragraph [ref=f7e52]: "The stylistic diversity is also a reflection of the band’s current operating circumstances: With two members now in Los Angeles, another in Portland, and just two remaining in the band’s Chicago hometown, their creative process has shifted dramatically from when they lived together in a loft space in the late 1990s, honing their sound over endless hours of collective experimentation."
        - paragraph [ref=f7e53]:
          - text: Recorded between the three cities — Los Angeles, Portland, and Chicago —
          - emphasis [ref=f7e54]: Touch
          - text: is the result of an intentional effort by these five musicians to reconnect, recenter, and reinvigorate their sound for what is perhaps the group’s most diverse release to date.
        - paragraph [ref=f7e55]:
          - strong [ref=f7e56]:
