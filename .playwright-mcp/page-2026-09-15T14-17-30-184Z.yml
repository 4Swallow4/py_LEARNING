          - text: announce
          - strong [ref=f7e26]:
            - emphasis [ref=f7e27]: Touch
          - text: ", the first new album from the groundbreaking group since 2016. This new record from the post-everything icons comes via"
          - strong [ref=f7e28]: International Anthem
          - text: and
          - strong [ref=f7e29]: Nonesuch Records
          - text: on LP, CD, and digital download on
          - strong [ref=f7e30]: October 24, 2025
          - text: ", and on streaming services on November 11, 2025. Lead single “"
          - strong [ref=f7e31]: Layered Presence
          - text: ” — which also comes via
          - link "video" [ref=f7e32] [cursor=pointer]:
            - /url: https://web.archive.org/web/20260629184914/https://intlanthem.us9.list-manage.com/track/click?u=bdf63ba201aac3a40783dd64e&id=763ac0de25&e=902961715e
          - text: filmed and directed by
          - strong [ref=f7e33]: Mikel Patrick Avery
          - text: — is out on all DSPs now.
        - paragraph [ref=f7e34]:
          - strong [ref=f7e35]:
            - link [ref=f7e36] [cursor=pointer]:
              - /url: https://web.archive.org/web/20260629184914/https://intlanthem.us9.list-manage.com/track/click?u=bdf63ba201aac3a40783dd64e&id=d3cb389bc2&e=902961715e
