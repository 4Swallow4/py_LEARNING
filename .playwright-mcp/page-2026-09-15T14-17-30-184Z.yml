        - heading "About" [level=2] [ref=f7e221]
        - paragraph [ref=f7e222]:
          - text: Tortoise is widely considered one of the most influential music groups of the last 40 years, with a wide-reaching impact on the contemporary music scene.
          - emphasis [ref=f7e223]: Pitchfork
          - text: "says: “Imagine a graphic showing all the bands the five members of Tortoise were in before they came together and then all the bands they went on to play with after. At the top of the funnel you have groups ranging from dreamy psych-rock to earthy post-punk crunch, including Eleventh Dream Day, Bastro, Slint, and the Poster Children; on the ‘post-Tortoise’ end are groups focusing on electro-jazz and twangy instrumental rock like Isotope 217, Chicago Underground, and Brokeback. In this graphic, Tortoise is the choke point, the one project that has elements of all these sounds but is never defined by nor committed to any of them. Instead, Tortoise floats free, a planchette moving over a Ouija board guided by 10 sets of fingers, where everyone watches the arrow float in one direction but no one is quite sure how it gets there or who is doing the pushing.”"
        - paragraph [ref=f7e224]:
          - text: The band, which originally formed in Chicago, comprises
          - strong [ref=f7e225]: Jeff Parker
          - text: ","
          - strong [ref=f7e226]: Dan Bitney
          - text: ","
          - strong [ref=f7e227]: Douglas McCombs
          - text: ","
          - strong [ref=f7e228]: John Herndon
          - text: ", and"
          - strong [ref=f7e229]: John McEntire
          - text: .
        - paragraph [ref=f7e230]:
          - text: Initially hailed as pace-setters of the then-emerging, so-called “post-rock” sound, the
          - emphasis [ref=f7e231]: Chicago Tribune
          - text: called Tortoise’s sound “mood music that refuses to be shoved into the background, as inviting as it is challenging.”
          - emphasis [ref=f7e232]
          - text: Releasing just seven albums since 1990 — including classics like 1996’s
          - emphasis [ref=f7e233]: Millions Now Living Will Never Die,
          - text: 1998’s
          - emphasis [ref=f7e234]: TNT,
          - text: and 2001’s
          - emphasis [ref=f7e235]: Standards
          - text: —Tortoise has steadily and intuitively evolved across its life, creating genreless music that is as timeless as it is ahead of the curve.
        - paragraph [ref=f7e236]:
          - text: The band’s legacy goes beyond its recorded output, as well. Per the
          - emphasis [ref=f7e237]: New York Time
          - text: "s: “While Tortoise’s albums have experimented with the editing and overdubbing possibilities of the studio, the band thrives performing in real time.”"
          - emphasis [ref=f7e238]: Rolling Stone
          - text: deems Tortoise “a live marvel,” while
          - emphasis [ref=f7e239]: Pitchfork
          - text: further
          - emphasis [ref=f7e240]
          - text: says the band’s performances reveal that “at heart, they’re a supremely fun band, wide open to all sorts of sonic possibilities.”
